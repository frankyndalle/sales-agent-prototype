[project]
name = "sales-agent-prototype"
version = "0.1.0"
description = "CAP 931 - Multi-Agent Sales Assistant Prototype with Source-Grounded Web Scraping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30.0",
    "langchain>=0.1.0",
    "langchain-groq>=0.1.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "python-dotenv>=1.0.0"
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]